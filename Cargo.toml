[workspace]
members = ["."]
resolver = "3"

[workspace.package]
version = "0.10.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
repository = "https://github.com/riii111/gh-loupe"

[workspace.dependencies]
# When adding third-party dependencies, update `absolute-paths-allowed-crates` in clippy.toml.
pulldown-cmark = { version = "0.13.4", default-features = false }
serde_json = { version = "1", features = ["preserve_order"] }

[package]
name = "gh-loupe"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Read fixed GitHub pull request and issue metadata through the GitHub CLI"
license.workspace = true
repository.workspace = true
homepage = "https://github.com/riii111/gh-loupe"
readme = "README.md"
keywords = ["github", "cli", "pull-request", "agent"]
categories = ["command-line-utilities", "development-tools"]
publish = false

[dependencies]
pulldown-cmark.workspace = true
serde_json.workspace = true

[lints]
workspace = true

[profile.release]
lto = true
codegen-units = 1

[workspace.lints.rust]
redundant_imports = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

cast_sign_loss = "allow"
needless_pass_by_value = "allow"
struct_field_names = "allow"

missing_const_for_fn = "allow"
significant_drop_tightening = "allow"

absolute_paths = "warn"
dbg_macro = "deny"
todo = "deny"
print_stdout = "deny"
print_stderr = "deny"
allow_attributes_without_reason = "deny"
