[workspace]
members = ["."]
resolver = "3"

[workspace.package]
version = "0.5.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
repository = "https://github.com/riii111/gh-read"

[workspace.dependencies]
# When adding third-party dependencies, update `absolute-paths-allowed-crates` in clippy.toml.
serde_json = { version = "1", features = ["preserve_order"] }

[package]
name = "gh-read"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Read fixed GitHub pull request and issue metadata through the GitHub CLI"
license.workspace = true
repository.workspace = true
homepage = "https://github.com/riii111/gh-read"
readme = "README.md"
keywords = ["github", "cli", "pull-request", "agent"]
categories = ["command-line-utilities", "development-tools"]
publish = false

[dependencies]
serde_json.workspace = true

[lints]
workspace = true

[profile.release]
lto = true
codegen-units = 1

[workspace.lints.rust]
redundant_imports = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
doc_markdown = "allow"
similar_names = "allow"
too_many_lines = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
cast_lossless = "allow"
items_after_statements = "allow"
needless_pass_by_value = "allow"
unused_self = "allow"
implicit_hasher = "allow"
match_wildcard_for_single_variants = "allow"
struct_field_names = "allow"

missing_const_for_fn = "allow"
significant_drop_tightening = "allow"
option_if_let_else = "allow"
future_not_send = "allow"
branches_sharing_code = "allow"
iter_with_drain = "allow"
collection_is_never_read = "allow"
used_underscore_binding = "allow"

absolute_paths = "warn"
dbg_macro = "deny"
todo = "deny"
print_stdout = "deny"
print_stderr = "deny"
allow_attributes_without_reason = "deny"
